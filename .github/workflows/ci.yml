# Checks every push and pull request: backend tests, frontend typecheck, and the Docker image
# Fly deploys (built, not pushed). The checks need no secrets. When they all pass on main, the demo
# is deployed to Fly (needs the FLY_DEMO_DEPLOY_TOKEN secret; skipped without it).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes an older, still-running check pointless. Not on main,
# though: that would also cancel a demo deploy halfway through.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Throwaway locations, so nothing points at a real database, log or export folder.
      DATABASE_URL: sqlite:///${{ github.workspace }}/ci-tmp/ci.db
      FOOD_MAP_PERSONAL_DIR: ${{ github.workspace }}/ci-tmp/personal
      FOOD_MAP_EXPORTS_DIR: ${{ github.workspace }}/ci-tmp/exports
      FOOD_MAP_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: mkdir -p ../ci-tmp
      - run: pytest -q

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The same Dockerfile Fly builds (it also builds the frontend), so a broken image shows up here
      # instead of during a deploy. Layers are cached between runs.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-demo:
    name: Deploy the demo
    # Only after every check passes, and only for pushes to main (not pull requests or other branches).
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time; a queued one waits rather than cancelling one halfway through.
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # FLY_DEMO_DEPLOY_TOKEN is a deploy token scoped to the demo app only. Without it (e.g. in a
      # fork) the job skips. --ha=false keeps the demo on one machine: each has its own database.
      - name: fly deploy (demo)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEMO_DEPLOY_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_DEMO_DEPLOY_TOKEN isn't set; skipping the deploy."
            exit 0
          fi
          flyctl deploy --config fly.demo.toml --remote-only --ha=false
